[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-tracer"
version = "0.1.0"
description = "Automated marketing and analytics tag tracing tool using browser automation and rule-based validation."
authors = [
    { name = "Alberto Caballero", email = "albertoCaballero80@outlook.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.45.0",
    "pandas>=2.2.2",
    "openpyxl>=3.1.2",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "pydantic>=2.8.2",
    "jinja2>=3.1.4"
]

[project.scripts]
tag-tracer = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.reporting" = ["templates/*.html"]
